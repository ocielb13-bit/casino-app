<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin PRO</title>
</head>
<body>

<h1>PANEL DE CONTROL</h1>

<<h2>⚙️ Configuración del Casino</h2>

<div style="display:grid; gap:10px; max-width:400px;">

  <label>
    🎯 Winrate (%W)
    <small>Probabilidad de que el jugador gane una tirada</small><br>
    <input id="win_rate" type="number">
  </label>

  <label>
    💸 RTP (% retorno)
    <small>Porcentaje de dinero que vuelve al jugador a largo plazo</small><br>
    <input id="rtp" type="number">
  </label>

  <label>
    🎰 Pago 3 iguales
    <small>Multiplicador cuando salen 3 símbolos</small><br>
    <input id="slot_pay_3" type="number">
  </label>

  <label>
    🎰 Pago 4 iguales
    <small>Multiplicador cuando salen 4 símbolos</small><br>
    <input id="slot_pay_4" type="number">
  </label>

  <label>
    🎰 Pago 5 iguales
    <small>Multiplicador cuando salen 5 símbolos</small><br>
    <input id="slot_pay_5" type="number">
  </label>

  <label>
    🎡 Winrate Ruleta
    <small>Probabilidad de acertar en la ruleta (%)</small><br>
    <input id="roulette_winrate" type="number">
  </label>

  <label>
    🎡 Pago Ruleta
    <small>Cuánto paga una apuesta ganadora (ej: 35x)</small><br>
    <input id="roulette_payout" type="number">
  </label>

  <label>
    🎁 Free Spins (FS)
    <small>Cantidad de tiradas gratis al activar bonus</small><br>
    <input id="free_spin_award" type="number">
  </label>

</div>

<br>

<button onclick="saveSettings()">💾 Guardar configuración</button>

<h2>👤 Usuarios</h2>

<div id="users"></div>

<script src="/admin.js"></script>
</body>
</html>
