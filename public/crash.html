<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crash</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="app-page">
  <div class="page">
    <div class="slot-shell">

      <div class="top-bar">
        <div>
          <div class="eyebrow">Fast Game</div>
          <h1 class="title">🚀 Crash</h1>
          <p class="muted" id="playerLine">Cargando...</p>
        </div>

        <button class="secondary" onclick="window.location.href='/menu.html'">
          ⬅ Volver
        </button>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="pill">💰 Saldo: <strong id="balance">0</strong></div>
        <div class="pill">🎯 Apuesta: <strong id="betDisplay">100</strong></div>
        <div class="pill">📈 Multiplicador: <strong id="multiplier">1.00x</strong></div>
      </div>

      <!-- MULTIPLICADOR GRANDE -->
      <div class="lobby-hero" style="text-align:center;">
        <div id="crashBig" class="big-multiplier">1.00x</div>
        <p id="status" class="muted">Esperando apuesta...</p>
      </div>

      <!-- CONTROLES -->
      <div class="form-grid">
        <input id="bet" type="number" min="1" value="100" placeholder="Apuesta">

        <!-- 🔥 BOTÓN ÚNICO -->
        <button id="btnAction" class="primary" type="button">
          🚀 Apostar
        </button>
      </div>

    </div>
  </div>

  <script src="/crash.js"></script>
</body>
</html>
