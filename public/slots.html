<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐉 Asian Dragon Slot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">
  <div class="page">
    <div class="machine">
      <div class="slot-shell">

        <!-- 🔝 HEADER -->
        <div class="top-bar">
          <div>
            <div class="eyebrow">Slots</div>
            <h1 class="title">🐉 Asian Dragon</h1>
            <p class="muted" id="playerLine">Cargando...</p>
          </div>

          <button class="secondary" onclick="window.location.href='/menu.html'">
            ⬅ Volver
          </button>
        </div>

        <!-- 📊 STATS -->
        <div class="stats">
          <div class="pill">💰 Saldo: <strong id="saldo">0</strong></div>
          <div class="pill">🌀 Free Spins: <strong id="freeLine">0</strong></div>
          <div class="pill">🏦 Banco FS: <strong id="bankLine">0</strong></div>
          <div class="pill">💎 Jackpot: <strong id="jackpotLine">1000</strong></div>
          <div class="pill">📈 RTP: <strong id="rtpLine">30</strong>%</div>
          <div class="pill">🧩 Paylines: <strong>25</strong></div>
          <div class="pill">🎯 Apuesta: <strong id="bet">100</strong></div>
        </div>

        <!-- 🎰 SLOT + CANVAS -->
        <div class="slot-wrapper">

          <!-- 🎯 PAYLINE CANVAS -->
          <canvas id="paylineCanvas"></canvas>

          <!-- 🎰 GRID REAL -->
       <div class="slot-grid">

  <div class="reel"><img id="r0c0"></div>
  <div class="reel"><img id="r0c1"></div>
  <div class="reel"><img id="r0c2"></div>

  <div class="reel"><img id="r1c0"></div>
  <div class="reel"><img id="r1c1"></div>
  <div class="reel"><img id="r1c2"></div>

  <div class="reel"><img id="r2c0"></div>
  <div class="reel"><img id="r2c1"></div>
  <div class="reel"><img id="r2c2"></div>

  <div class="reel"><img id="r3c0"></div>
  <div class="reel"><img id="r3c1"></div>
  <div class="reel"><img id="r3c2"></div>

  <div class="reel"><img id="r4c0"></div>
  <div class="reel"><img id="r4c1"></div>
  <div class="reel"><img id="r4c2"></div>

</div>

        <p class="slot-caption">
          25 paylines activas · el pago se acumula por línea.
        </p>

        <!-- 🎮 CONTROLES -->
        <div class="controls">
          <div class="bet-controls">
            <button onclick="changeBet(-1000)">-1000</button>
            <button onclick="changeBet(-100)">-100</button>
            <button onclick="changeBet(-10)">-10</button>
            <button onclick="changeBet(10)">+10</button>
            <button onclick="changeBet(100)">+100</button>
            <button onclick="changeBet(1000)">+1000</button>
          </div>

          <button id="btnSpin" class="spin-btn" onclick="jugar()">
            🎰 GIRAR
          </button>
        </div>

        <!-- 📢 PAYLINES INFO -->
        <div id="paylineFeed" class="payline-feed"></div>

        <!-- 📊 RESULTADOS -->
        <div class="results">
          <p id="resultado"></p>
          <p id="detallePago"></p>
          <p id="bonusHint"></p>
        </div>

      </div>
    </div>
  </div>

  <script src="/slots.js"></script>
</body>
</html>
