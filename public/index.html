<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <div class="page">
    <div class="card auth-card">
      <div class="eyebrow">Casino virtual</div>
      <h1 class="title">Entrar</h1>
      <p class="muted">Ingresá con tu usuario y contraseña.</p>

      <input id="username" placeholder="Usuario" autocomplete="username">
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">

      <button type="button" class="primary" onclick="login()">Entrar</button>
      <p id="error" class="small"></p>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
