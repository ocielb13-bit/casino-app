<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruleta Pro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">
  <div class="page">
    <div class="roulette-shell">

      <div class="roulette-top">
        <div>
          <div class="eyebrow">Mesa</div>
          <h1 class="title">🎡 Ruleta Pro</h1>
          <p class="muted" id="playerLine">Cargando...</p>
        </div>

        <button class="secondary" onclick="window.location.href='/menu.html'">⬅ Volver</button>
      </div>

      <div class="kpi">
        <div class="pill">💰 Saldo: <strong id="saldo">0</strong></div>
        <div class="pill">🎯 Pago: <strong id="payoutLine">35:1</strong></div>
        <div class="pill">🎲 Mesa: <strong>Premium</strong></div>
      </div>

      <div class="roulette-stage">
        <div class="wheel-wrap">
          <div class="wheel-frame">
            <div class="pointer"></div>
            <div id="wheel" class="wheel-box">0</div>
          </div>
          <p class="muted">Elegí un número del 0 al 36 y girá la rueda.</p>
        </div>

        <div class="slot-shell">
          <h2 style="margin-bottom: 14px;">🎯 Tus apuestas</h2>

          <div class="row">
            <input id="numero" type="number" min="0" max="36" placeholder="Número (0-36)">
            <input id="apuesta" type="number" min="1" placeholder="Apuesta">
          </div>

          <div class="row">
            <button type="button" onclick="jugar()">🎡 Girar</button>
            <button type="button" class="secondary" onclick="limpiar()">Limpiar</button>
          </div>

          <p id="resultado"></p>

          <div class="history-box">
            <div class="small">Últimos resultados</div>
            <div id="history" class="history-list"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/ruleta.js"></script>
</body>
</html>
